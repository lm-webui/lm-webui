# LM-WebUI Configuration
# Environment variables override these values (APP_ prefix).
# Config is generated at ~/.lmwebui/config.yaml on install.

server:
  host: "0.0.0.0"
  port: 7070

database:
  url: "sqlite:///~/.lmwebui/data/sql_db/app.db"

paths:
  base_dir: "~/.lmwebui"
  data_dir: "~/.lmwebui/data"
  media_dir: "~/.lmwebui/media"
  models_dir: "~/.lmwebui/models"

rag:
  enabled: true
  embedding_model: "BAAI/bge-small-en-v1.5"
  reranker_model: "ms-marco-MultiBERT-L-12"
  chunk_size: 512
  chunk_overlap: 64
  top_k_retrieval: 20
  scope: "user"
  context_token_budget: 2000
  query_rewrite: false
  engine: "bge"          # "bge" (legacy text) | "multimodal" (Architecture B)
  multimodal:
    enabled: false
    vision_model: "google/siglip2-base-patch16-224"
    short_chunk_words: 50

vision:
  provider: ""
  model: "unsloth/Qwen3-VL-2B-Instruct-1M-Q4_K_M.gguf"
  port: 8081
  ctx_size: 8192
  gpu_layers: 99
  flash_attn: "on"
  cache_type_k: "q8_0"
  cache_type_v: "q8_0"

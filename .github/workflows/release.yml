name: Release
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Assemble release tarball
        run: |
          mkdir -p lm-webui/web
          cp -r backend/app lm-webui/app
          cp -r web/dist lm-webui/web/dist
          cp web/package.json lm-webui/web/package.json
          cp backend/requirements.txt backend/requirements.lock lm-webui/
          cp backend/config.yaml lm-webui/config.yaml
          cp package.json lm-webui/
          cp install.sh lm-webui/
          cp scripts/lmwebui lm-webui/lmwebui
          tar -czf lm-webui.tar.gz lm-webui

      # Before anything is published: does the archive actually contain what an install reads,
      # and does installing it leave a user's config.yaml and data/ alone? The tarball is
      # assembled by the hand-written cp list above, so a newly added runtime file can silently
      # fail to ship without this.
      - name: Smoke test tarball
        run: bash ./scripts/smoke-tarball.sh lm-webui.tar.gz

      # Hand the frontend to the desktop job so the release builds it exactly once. It lands at
      # web/dist in that job because tauri's frontendDist (../../web/dist) and build-sidecar.sh
      # both read that path.
      - name: Upload frontend bundle for the desktop job
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

      - name: Create release + upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `--generate-notes` makes an extra REST call that occasionally 503s on GitHub's side
          # (transient outage). Create idempotently + retry so a one-off hiccup doesn't fail the build.
          for i in 1 2 3 4 5; do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" && break
            echo "release create attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || exit 1
          gh release upload "$GITHUB_REF_NAME" lm-webui.tar.gz --clobber

  desktop-macos:
    needs: build
    # `macos-14` is the free arm64 (Apple Silicon) runner and matches the
    # LM-WebUI-macos-arm64.dmg name / "Apple Silicon" claim. `macos-14-xlarge` is a
    # PAID larger runner (Team/Enterprise) — it blocks free repos before any step runs.
    # ponytail: to build Intel instead, use macos-14-large and rename to
    # LM-WebUI-macos-x86_64.dmg — never publish a mislabeled binary.
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The frontend was built once, in the `build` job. Rebuilding it here would mean two builds
      # of the same commit that can quietly diverge. The output is platform-independent JS/CSS —
      # rollup's platform-specific binaries are build-time only, and nothing in web/vite.config.ts
      # branches on platform.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install desktop dependencies
        run: |
          cd desktop
          npm install
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build macOS DMG
        run: |
          test -f web/dist/index.html   # fail here, not 400 lines into tauri
          cd desktop
          npm run version:sync
          # Override beforeBuildCommand so tauri does not rebuild the frontend it was just given.
          # build:sidecar must stay — it populates src-tauri/web-dist and
          # src-tauri/binaries/lm-webui-backend, both bundle.resources.
          npm run tauri -- build --bundles dmg \
            --config '{"build":{"frontendDist":"../../web/dist","beforeBuildCommand":"npm run build:sidecar"}}'

      - name: Rename DMG to stable download name
        run: |
          dmg=$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -type f | head -n 1)
          test -n "$dmg"
          cp "$dmg" LM-WebUI-macos-arm64.dmg

      - name: Upload macOS DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" LM-WebUI-macos-arm64.dmg --clobber

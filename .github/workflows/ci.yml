name: Simplified AI Platform CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24.13"
  IMAGE_NAME: lm-webui

jobs:
  # ----------------------------------------
  # STAGE 1: VALIDATE & TEST (Parallel)
  # ----------------------------------------
  validate:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Python setup
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install uv
      - name: Setup uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Install Python tools
      - name: Install Python dependencies
        run: |
          uv pip install --system ruff mypy pip-audit pytest pytest-cov
          cd backend && uv pip install --system -r requirements-test.txt
      # Code quality checks (non-blocking for now)
      - name: Run Ruff linting
        run: ruff check backend || echo "Ruff found issues that need addressing"

      - name: Run mypy type checking
        run: mypy backend || echo "Type checking found issues"

      # Security scanning
      - name: Audit Python dependencies
        run: cd backend && pip-audit || echo "pip-audit found security issues"

      # Node.js setup
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Frontend checks
      - name: Install frontend dependencies
        run: cd web && npm install

      - name: Run TypeScript type check
        run: cd web && npm run typecheck || echo "TypeScript type errors found"

      - name: Audit npm dependencies
        run: cd web && npm audit --audit-level=high || echo "npm audit found security issues"

  test:
    name: Unit & AI Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install backend dependencies
        run: |
          cd backend
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-test.txt
      # Run backend unit tests (hermetic; integration excluded via pytest.ini)
      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=0
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend

      # AI-specific smoke tests
      - name: Run AI functionality smoke test
        run: |
          cd backend
          python -c "
          # Basic AI platform smoke test
          try:
              # Test model loading capability
              from app.services.model_registry import ModelRegistry
              print('✓ ModelRegistry import successful')

              # Test API routes exist
              from app.main import app
              routes = [route.path for route in app.routes]
              ai_routes = [r for r in routes if 'chat' in r or 'image' in r]
              print(f'✓ Found {len(ai_routes)} AI-related routes')

              print('AI platform smoke test passed')
          except Exception as e:
              print(f'AI smoke test warning: {e}')
              print('Continuing pipeline - AI components may need setup')
          "
      # Frontend tests
      - name: Run frontend tests
        run: |
          cd web
          npm test -- --coverage || echo "Frontend tests failed - continuing"
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: web/coverage
          flags: frontend

  package:
    name: Validate compiled core and release tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install compiler cache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache Nuitka compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('backend/requirements.lock', 'backend/app/**/*.py', 'packaging/core_entry.py', 'scripts/build-core.sh') }}
          restore-keys: ${{ runner.os }}-nuitka-

      - name: Install backend and packaging dependencies
        run: |
          python3 -m pip install --upgrade nuitka
          python3 -m pip install -r backend/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Build compiled backend
        run: |
          test -f packaging/core_entry.py
          bash scripts/build-core.sh dist/core

      - name: Assemble and smoke-test release tarball
        run: |
          mkdir -p lm-webui/web
          cp -r dist/core/. lm-webui/core
          cp -r web/dist lm-webui/web/dist
          cp web/package.json lm-webui/web/package.json
          cp backend/requirements.txt backend/requirements.lock lm-webui/
          cp backend/config.yaml lm-webui/config.yaml
          cp package.json install.sh scripts/lmwebui lm-webui/
          cp dist/core/manifest.json lm-webui/core-manifest.json
          tar -czf lm-webui.tar.gz lm-webui
          bash scripts/smoke-core.sh lm-webui
          bash scripts/smoke-tarball.sh lm-webui.tar.gz

  # ----------------------------------------
  # STAGE 2: BUILD & SECURE (Depends on validate, test)
  # ----------------------------------------
  build:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    needs: [validate, test, package]

    steps:
      - uses: actions/checkout@v4

      # API contract validation
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install backend dependencies
        run: cd backend && uv pip install --system -r requirements.txt

      - name: Validate OpenAPI schema
        run: |
          cd backend
          python -c "from app.main import app; import json; schema = json.dumps(app.openapi()); print(f'OpenAPI schema generated ({len(schema)} bytes)')"
          echo "API contract validation passed"
      # Docker build with security scanning
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (reproducible)
        run: docker build --no-cache -t $IMAGE_NAME:test .

      - name: Scan container for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: "sarif"
          output: "trivy-results.sarif"
          skip-files: |
            **/models/**
            **/blobs/**
            **/rerank/**

  # ----------------------------------------
  # STAGE 3: DEPLOY & VERIFY (Depends on build)
  # ----------------------------------------
  deploy:
    name: Runtime Verification
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Run Docker Compose integration test
        run: |
          docker compose up -d --build
          sleep 30
          docker compose ps
          # Debug logs if startup fails
          docker compose logs lm-webui
          # Test through docker compose
          echo "Testing docker compose health..."
          curl --fail --retry 5 --retry-delay 5 --retry-max-time 30 http://localhost:7070/api/health
          echo "Container health verification passed"
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v

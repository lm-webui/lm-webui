services:
  lm-webui:
    build: .
    image: lm-webui:latest
    container_name: lm-webui
    ports:
      - "7070:8000"
    volumes:
      - ./.lmwebui/data:/backend/data
      - ./.lmwebui/media:/backend/media
      - ./backend/models:/backend/models
      - ./backend/.secrets:/backend/.secrets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENVIRONMENT=production
      - APP_PATHS_DATA_DIR=/backend/data
      - APP_PATHS_MEDIA_DIR=/backend/media
      - APP_RUNTIME_DEFAULT_ENDPOINT=${APP_RUNTIME_DEFAULT_ENDPOINT:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health')); raise SystemExit(0 if d.get('ready') else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

